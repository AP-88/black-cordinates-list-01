services:

  service-a-container:
    build:
      context: ./serviceA/
      dockerfile: Dockerfile
    container_name: svc-a-cont
    volumes:
      # Mounts a local "data" directory
      - ./data:/app/data:ro
    networks:
      - my-network
    ports:
      - "8081:8080"

  service-b-container:
    build:
      context: ./serviceB/
      dockerfile: Dockerfile
    container_name: svc-b-cont
    volumes:
      # Mounts a local "data" directory
      - ./data:/app/data
    networks:
      - my-network
    ports:
      - "8082:8080"
    
  service-c-container:
    build:
      context: ./serviceC/
      dockerfile: Dockerfile
    container_name: svc-c-cont
    volumes:
      # Mounts a local "data" directory
      - ./data:/app/data:ro
    networks:
      - my-network
    ports:
      - "8083:8080"
  
  # KAFKA INFRASTRUCTURE & CONSUMER SERVICES
  # =========================================================================
  kafka-broker:
    image: apache/kafka:4.3.1
    container_name: kafka-broker
    hostname: kafka-broker
    environment:
      # Standalone KRaft controller configuration properties
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: 'broker,controller'
      KAFKA_LISTENERS: 'PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093'
      KAFKA_ADVERTISED_LISTENERS: 'PLAINTEXT://kafka-broker:9092'
      KAFKA_CONTROLLER_QUORUM_VOTERS: '1@kafka-broker:9093'
      KAFKA_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'
      LOG_DIR: '/var/lib/kafka/data'
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
    volumes:
      - kafka-data:/var/lib/kafka/data
    networks:
      - my-network

  kafka-init:
    image: apache/kafka:4.3.1
    container_name: kafka-init
    depends_on:
      kafka-broker:
        condition: service_started
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >
        echo "Waiting for Kafka broker storage layers to accept connections..." &&
        sleep 5 &&
        /opt/kafka/bin/kafka-topics.sh \
          --bootstrap-server kafka-broker:9092 \
          --create \
          --if-not-exists \
          --topic user-gateway \
          --partitions 1 \
          --replication-factor 1
    restart: "no"
    networks:
      - my-network

  kafka-consumer:
    build:
      context: ./kafka-consumer/
      dockerfile: Dockerfile
    container_name: kafka-consumer
    depends_on:
      kafka-init:
        condition: service_completed_successfully
    environment:
      KAFKA_BOOTSTRAP_SERVERS: "kafka-broker:9092"
      KAFKA_TOPIC: "user-gateway"
      KAFKA_GROUP_ID: "user-gateway-group"
      SERVICE_B_URL: "http://svc-b-cont:8080"
    restart: unless-stopped
    networks:
      - my-network

networks:
  my-network:
    driver: bridge

volumes:
  kafka-data: